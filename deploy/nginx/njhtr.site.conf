limit_req_zone $binary_remote_addr zone=dorm_auth_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dorm_register_code_ip:10m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name njhtr.site www.njhtr.site;
    return 301 https://njhtr.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.njhtr.site;

    ssl_certificate /etc/nginx/tls/njhtr.site.pem;
    ssl_certificate_key /etc/nginx/tls/njhtr.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://njhtr.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name njhtr.site;

    ssl_certificate /etc/nginx/tls/njhtr.site.pem;
    ssl_certificate_key /etc/nginx/tls/njhtr.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /opt/dorm-check/frontend;
    index index.html;
    client_max_body_size 64k;
    client_body_timeout 10s;

    # Keep the admin UI and API reachable only from trusted private networks.
    location ^~ /admin {
        allow 127.0.0.1/32;
        allow ::1/128;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        allow fc00::/7;
        allow fe80::/10;
        deny all;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/admin {
        allow 127.0.0.1/32;
        allow ::1/128;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        allow fc00::/7;
        allow fe80::/10;
        deny all;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /api/auth/ {
        limit_req zone=dorm_auth_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /api/auth/register-code {
        limit_req zone=dorm_register_code_ip burst=2 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
