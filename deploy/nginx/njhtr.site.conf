limit_req_zone $binary_remote_addr zone=dorm_auth_ip:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name njhtr.site www.njhtr.site;
    return 301 https://njhtr.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.njhtr.site;

    ssl_certificate /etc/nginx/tls/njhtr.site.pem;
    ssl_certificate_key /etc/nginx/tls/njhtr.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://njhtr.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name njhtr.site;

    ssl_certificate /etc/nginx/tls/njhtr.site.pem;
    ssl_certificate_key /etc/nginx/tls/njhtr.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /opt/dorm-check/frontend;
    index index.html;

    location ^~ /api/auth/ {
        limit_req zone=dorm_auth_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
