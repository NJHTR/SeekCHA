bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /run/redis/dorm-check.pid
loglevel notice
logfile ""
databases 2
always-show-logo no

save 900 1
save 300 10
save 60 10000
dir /opt/dorm-check/var/redis
dbfilename dump.rdb

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

maxmemory 128mb
maxmemory-policy noeviction

# Replaced during deployment with a server-local random value.
requirepass __REDIS_PASSWORD__
